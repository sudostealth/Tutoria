<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2430"/>
      <stop offset="100%" stop-color="#123B36"/>
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3A6"/>
      <stop offset="100%" stop-color="#0EA96F"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bg)"/>

  <!-- connecting arc: parent node <-> tutor node, forms the top of the T -->
  <path d="M62,74 Q100,38 138,74" fill="none" stroke="url(#arc)" stroke-width="13" stroke-linecap="round"/>

  <!-- T stem -->
  <rect x="93" y="70" width="14" height="82" rx="7" fill="#EAFBF4"/>

  <!-- two nodes: guardian & tutor -->
  <circle cx="62" cy="74" r="15" fill="#EAFBF4"/>
  <circle cx="138" cy="74" r="15" fill="#EAFBF4"/>
  <circle cx="62" cy="74" r="6" fill="#0EA96F"/>
  <circle cx="138" cy="74" r="6" fill="#0EA96F"/>
</svg>
